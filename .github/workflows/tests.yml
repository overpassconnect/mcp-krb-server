# Runs the unit tests on every push and pull request.
#
# The suite is hermetic: a fake gssapi stands in for python3-gssapi, so it needs
# no KDC, no native packages and no MCP SDK. That is why this workflow installs
# nothing. Both platforms are exercised because the client kit is authored on
# Windows and executed on Linux, and the tests are the only thing that checks the
# same source behaves on both.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # bash on both runners: Windows images ship Git Bash, so one command covers
      # the matrix and the script itself stays POSIX sh.
      - name: unit tests
        shell: bash
        run: sh tests/run-tests.sh

  # The Pester tests target Windows PowerShell 5.1, the runtime the client
  # scripts actually execute under, so `shell: powershell`, not pwsh. This job
  # installs Pester 5 explicitly (the runner image ships 3.4 inbox), which is
  # what keeps run-tests.sh's local "no Pester" skip from quietly becoming the
  # only outcome anywhere.
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install Pester 5
        shell: powershell
        run: Install-Module Pester -Force -SkipPublisherCheck -Scope CurrentUser -MinimumVersion 5.0
      - name: pester tests
        shell: powershell
        run: |
          $r = Invoke-Pester -Path tests/powershell -PassThru -Output Detailed
          if ($r.FailedCount -gt 0 -or $r.TotalCount -eq 0) { exit 1 }
